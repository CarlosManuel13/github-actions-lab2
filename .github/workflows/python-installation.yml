name: Installing Python

on: [push]

jobs:
  build:
    strategy:
      matrix:
        os: 
          - ubuntu-latest 
          - mac-os-14 
          - windows-latest]
        version-py: 
          - 3.10 
          - 3.11 
          - 3.12
    runs-on: ${{ matrix.os }}
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.version-py }}
        
